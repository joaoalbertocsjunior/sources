[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sources-lib"
version = "0.1.0"
description = "Agnostic sources adapter, JSON-schema M2M interface, and HTTP control library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["sources", "adapter", "m2m", "json-rpc", "http-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

# Core layers (adapter, registry, m2m, http) are stdlib-only — zero install-time conflicts.
# Optional extras add richer backends for specific built-in adapters:
#   pip install sources-lib[postgres]   — DatabaseAdapter with psycopg2
#   pip install sources-lib[http]       — HttpPollAdapter with httpx
[project.optional-dependencies]
validation = ["jsonschema>=4.0"]
test = ["pytest>=8.0", "pytest-timeout>=2.0"]
postgres = ["psycopg2-binary>=2.9"]
http     = ["httpx>=0.27"]
ai       = ["litellm>=1.0"]
mcp      = ["mcp>=1.0"]
all      = ["psycopg2-binary>=2.9", "httpx>=0.27", "litellm>=1.0", "mcp>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
