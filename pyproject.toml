[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sources-lib"
version = "0.1.0"
description = "Agnostic sources adapter, JSON-schema M2M interface, and HTTP control library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["sources", "adapter", "m2m", "json-rpc", "http-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.0"]
test = ["pytest>=8.0", "pytest-timeout>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
